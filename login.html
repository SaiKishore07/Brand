<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Account Login | WEBUOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --primary-blue: #0076e6;
      --primary-hover: #0060be;
      --badge-bg: #f0f9ff;
      --badge-border: #bae6fd;
      --badge-text: #0284c7;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
      --info-text: #334155;
      --input-border: #e2e8f0;
      --input-focus: #0076e6;
      --input-focus-ring: rgba(0, 118, 230, 0.15);
      --radius-card: 24px;
      --radius-input: 14px;
      --radius-btn: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .auth-container {
      width: 100%;
      max-width: 580px;
    }

    /* Auth Card matching reference image aesthetic */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      padding: 38px 42px;
      box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.05), 0 0 1px 1px rgba(15, 23, 42, 0.02);
    }

    /* Top Cyan Pill Badge */
    .badge-pill {
      display: inline-flex;
      align-items: center;
      background-color: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--badge-text);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    /* Form Layout */
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 13.5px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-label .forgot-link {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--primary-blue);
      text-decoration: none;
    }

    .form-label .forgot-link:hover {
      text-decoration: underline;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-left {
      position: absolute;
      left: 14px;
      color: var(--text-light);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .input-icon-left svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.8;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 16px 0 44px;
      border: 1px solid var(--input-border);
      border-radius: var(--radius-input);
      font-size: 14.5px;
      color: var(--text-main);
      background-color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input.has-right-icon {
      padding-right: 44px;
    }

    .form-input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .form-input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px var(--input-focus-ring);
    }

    .input-wrapper:focus-within .input-icon-left {
      color: var(--input-focus);
    }

    .input-icon-right {
      position: absolute;
      right: 14px;
      color: var(--text-light);
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s ease;
    }

    .input-icon-right:hover {
      color: var(--text-main);
    }

    .input-icon-right svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.8;
    }

    /* Verification Notice Callout */
    .info-banner {
      background-color: var(--info-bg);
      border: 1px solid var(--info-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-banner-icon {
      color: #2563eb;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .info-banner-icon svg {
      width: 19px;
      height: 19px;
      stroke-width: 2;
    }

    .info-banner-text {
      font-size: 13.5px;
      color: var(--info-text);
      line-height: 1.4;
    }

    /* Checkbox */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      user-select: none;
    }

    .custom-checkbox {
      width: 18px;
      height: 18px;
      border: 1.5px solid #cbd5e1;
      border-radius: 5px;
      cursor: pointer;
      accent-color: var(--primary-blue);
      margin-top: 0;
      flex-shrink: 0;
    }

    .checkbox-label {
      font-size: 13.5px;
      color: #475569;
      cursor: pointer;
    }

    /* Primary CTA Button */
    .primary-btn {
      width: 100%;
      height: 50px;
      background: var(--primary-blue);
      border: none;
      border-radius: var(--radius-btn);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 118, 230, 0.25);
    }

    .primary-btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 18px rgba(0, 118, 230, 0.35);
      transform: translateY(-1px);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    .primary-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
      transition: transform 0.2s ease;
    }

    .primary-btn:hover svg {
      transform: translateX(3px);
    }

    /* Card Footer Link */
    .card-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .card-footer a {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 680px) {
      .auth-card {
        padding: 26px 20px;
        border-radius: 20px;
      }
      .card-title {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <section class="auth-card">
      <!-- Top Pill Badge -->
      <div>
        <span class="badge-pill">ORGANIZATION / BRAND LOGIN</span>
      </div>

      <!-- Title & Subtitle -->
      <h1 class="card-title">Brand account login</h1>
      <p class="card-subtitle">Enter your credentials to access your WEBUOS Brand workspace.</p>

      <!-- Brand Login Form -->
      <form id="loginForm" onsubmit="event.preventDefault(); alert('Signed in to Brand Workspace successfully!');">
        <div class="form-grid">
          <!-- Work Email / Brand ID -->
          <div class="form-group">
            <label class="form-label" for="brandEmail">Work Email or Brand ID</label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <!-- Mail Icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </span>
              <input class="form-input" type="email" id="brandEmail" placeholder="you@company.com" required />
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <div class="form-label">
              <label for="brandPassword" style="cursor: pointer;">Password</label>
              <a href="#forgot" class="forgot-link" onclick="alert('Password reset instructions will be sent to your work email.'); return false;">Forgot password?</a>
            </div>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <!-- Lock Icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input class="form-input has-right-icon" type="password" id="brandPassword" placeholder="••••••••" required />
              <button type="button" class="input-icon-right" onclick="togglePassword('brandPassword', this)" title="Toggle password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <!-- Company / Brand Code (Optional) -->
          <div class="form-group">
            <label class="form-label" for="brandCode">
              <span>Company / Workspace Code</span>
              <span style="font-size: 11.5px; font-weight: 500; color: #94a3b8;">Optional</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <!-- Building Icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
              </span>
              <input class="form-input" type="text" id="brandCode" placeholder="e.g. acme-brand" />
            </div>
          </div>
        </div>

        <!-- Security Banner -->
        <div class="info-banner">
          <span class="info-banner-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          </span>
          <span class="info-banner-text">Protected by WEBUOS enterprise Single Sign-On (SSO) &amp; multi-factor verification.</span>
        </div>

        <!-- Remember device -->
        <div class="checkbox-row">
          <input type="checkbox" id="rememberDevice" class="custom-checkbox" checked />
          <label for="rememberDevice" class="checkbox-label">
            Keep this device trusted for 30 days
          </label>
        </div>

        <!-- Primary CTA Button -->
        <button type="submit" class="primary-btn">
          <span>Sign In to Brand Account</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Footer Register link -->
      <div class="card-footer">
        Don't have a business account? <a href="register.html">Register organization &rarr;</a>
      </div>
    </section>
  </div>

  <script>
    function togglePassword(id, btn) {
      const el = document.getElementById(id);
      const isPwd = el.type === 'password';
      el.type = isPwd ? 'text' : 'password';
      btn.innerHTML = isPwd 
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
  </script>
</body>
</html>
